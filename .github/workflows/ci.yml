name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  check:
    name: format, vet, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@latest
          make fmt-check
      - name: vet
        run: make vet
      # v8 is the first action release that runs golangci-lint v2, which
      # `.golangci.yml` declares with `version: "2"`, and v9 is the first that
      # runs on Node 24. v8 is a node20 action, so it kept the deprecation
      # warning this bump exists to clear.
      #
      # The version is pinned rather than `latest`, and it is the version this
      # repository lints with locally, because golangci-lint refuses a module
      # whose Go directive is newer than the Go it was itself built with:
      # `latest` resolved to a binary built with go1.24 and every run failed
      # with "the Go language version (go1.24) used to build golangci-lint is
      # lower than the targeted Go version". A linter that floats is also a
      # linter that can fail a pull request that changed nothing.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      # A second pass with no build tags, because the config turns all eight on
      # and `unused` then cannot see a symbol that is live under `write` and
      # dead without it. Called by name rather than folded into the step above
      # for the same reason `make vuln` is: this workflow runs the targets one
      # at a time, so a check only in `make lint` is a check CI skips.
      - name: unused, with no build tags
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          make lint-untagged

  vuln:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod pins a patch version, so a runner on an older 1.26 fetches
          # the toolchain it asks for. That is the point: the scan reports the
          # standard library it is actually built against, and GO-2026-5856 was
          # a finding in crypto/tls rather than in anything this module wrote.
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make vuln

  test:
    name: test (tags=${{ matrix.tags && matrix.tags || 'none' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every shipped profile. A command that only compiles under one of them
        # fails the others loudly.
        tags:
          - ""
          - "mcp"
          - "mcp,write"
          - "tui,prompt,render,browser,clipboard,mcp,write,admin"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # internal/lint runs gocognit as a subprocess and fails rather than skips
      # when it is absent, on the argument that a complexity gate which did not
      # run reads exactly like one that passed. That argument only holds if CI
      # installs the tool, so this step is part of the gate and not a
      # convenience. Pinned to the version this repository lints with locally,
      # because the scores are the tool's and a float would fail a pull request
      # that changed nothing.
      - name: gocognit
        run: go install github.com/uudashr/gocognit/cmd/gocognit@v1.2.1
      # -race because the request budget is shared across concurrent
      # pagination, and a counter that undercounts would silently exceed the
      # limit it exists to enforce.
      - name: test
        run: go test -race -tags "${{ matrix.tags }}" ./...

  contract:
    name: output contract is unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # The golden files are the public output contract. A diff here is a diff
      # every consumer sees, so it must be committed deliberately alongside a
      # schema version bump — never regenerated by CI.
      - name: regenerate goldens
        run: make golden
      - name: fail if the contract drifted
        run: |
          if ! git diff --exit-code --stat; then
            echo
            echo "The output contract changed but the golden files were not updated."
            echo "Run 'make golden', review every diff, and bump the schema version"
            echo "of each affected kind in the same commit."
            exit 1
          fi

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # Go keeps the generated corpus in $GOCACHE/fuzz. Without this, every CI
      # run starts from the seeds alone and spends its whole budget
      # re-deriving the same shallow coverage. Persisting it makes each run
      # continue where the last one stopped, so coverage compounds instead of
      # resetting.
      - name: locate the fuzz cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - name: restore the fuzz corpus
        uses: actions/cache@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          # The key rotates every run so a run that finds new inputs saves
          # them; restore-keys falls back to the most recent previous corpus.
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      # The seed corpus runs as part of `go test`. This is the search on top of
      # it: quoting, escaping, and date parsing are where a silent
      # mis-interpretation would do real damage, so they get exercised with
      # inputs nobody thought to write down.
      - name: fuzz
        run: make fuzz FUZZTIME=60s
      - name: upload any crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: internal/**/testdata/fuzz/

  profiles:
    name: build profiles and size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build every profile
        run: make build-all
      - name: reader stays under budget
        run: make size
      - name: every profile reports its own identity
        run: |
          for b in bin/jr bin/jr-agent bin/jr-reader bin/jr-ci; do
            "$b" version --format tsv | grep '^display'
          done
