name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The patch, not the minor. actions/setup-go sets GOTOOLCHAIN=local, so the
  # go command will not fetch what go.mod asks for: it refuses. This has to be
  # the same patch version go.mod names, and a lint test says so.
  GO_VERSION: "1.26.6"

jobs:
  check:
    name: format, vet, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # Pinned from the Makefile, on the same argument the two steps below
      # already made for themselves and this one did not: a formatter that
      # floats can fail a pull request that changed nothing, and here it can
      # also fail a release, because the gate re-runs `make ci` on a tag that
      # cannot be moved.
      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@$(make -s print-GOFUMPT_VERSION)
          make fmt-check
      - name: vet
        run: make vet
      # The modernizer that ships with the toolchain. No install step and no
      # version to pin: it is `go fix`, so GO_VERSION above is the only version
      # it has. Named here rather than left to `make ci` for the reason the
      # steps around it are: this workflow runs the targets one at a time, so a
      # check only in `make ci` is a check CI skips.
      - name: modernizer
        run: make fix-check
      # v8 is the first action release that runs golangci-lint v2, which
      # `.golangci.yml` declares with `version: "2"`, and v9 is the first that
      # runs on Node 24. v8 is a node20 action, so it kept the deprecation
      # warning this bump exists to clear.
      #
      # The version is pinned rather than `latest`, and it is the version this
      # repository lints with locally, because golangci-lint refuses a module
      # whose Go directive is newer than the Go it was itself built with:
      # `latest` resolved to a binary built with go1.24 and every run failed
      # with "the Go language version (go1.24) used to build golangci-lint is
      # lower than the targeted Go version". A linter that floats is also a
      # linter that can fail a pull request that changed nothing.
      # The one tool an action installs rather than `go install`, so its
      # version cannot come from the Makefile the way the others do. It is
      # asserted equal to GOLANGCI_LINT_VERSION by internal/lint instead, since
      # two places declaring one version is exactly the drift this file's own
      # comments keep warning about.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      # A second pass with no build tags, because the config turns all eight on
      # and `unused` then cannot see a symbol that is live under `write` and
      # dead without it. Called by name rather than folded into the step above
      # for the same reason `make vuln` is: this workflow runs the targets one
      # at a time, so a check only in `make lint` is a check CI skips.
      - name: unused, with no build tags
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@$(make -s print-STATICCHECK_VERSION)
          make lint-untagged

  vuln:
    name: vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # GO_VERSION is the patch go.mod names, so the scan reports the
          # standard library this build is actually against. GO-2026-5856 was a
          # finding in crypto/tls rather than in anything this module wrote, and
          # so were the four that followed it: the toolchain is the exposure.
          #
          # This said the runner would fetch what go.mod asked for. It does not.
          # setup-go sets GOTOOLCHAIN=local, so a mismatch is `go.mod requires
          # go >= X (running go Y; GOTOOLCHAIN=local)` and every job fails at
          # once. The two numbers move together or nothing runs.
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@$(make -s print-GOVULNCHECK_VERSION)
          make vuln

  test:
    name: test (tags=${{ matrix.tags && matrix.tags || 'none' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every shipped profile. A command that only compiles under one of them
        # fails the others loudly.
        tags:
          - ""
          - "mcp"
          - "mcp,write"
          - "prompt,render,mcp,write,admin"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # internal/lint runs gocognit as a subprocess and fails rather than skips
      # when it is absent, on the argument that a complexity gate which did not
      # run reads exactly like one that passed. That argument only holds if CI
      # installs the tool, so this step is part of the gate and not a
      # convenience. Pinned to the version this repository lints with locally,
      # because the scores are the tool's and a float would fail a pull request
      # that changed nothing.
      - name: gocognit
        run: go install github.com/uudashr/gocognit/cmd/gocognit@$(make -s print-GOCOGNIT_VERSION)
      # -race because the request budget is shared across concurrent
      # pagination, and a counter that undercounts would silently exceed the
      # limit it exists to enforce.
      - name: test
        run: go test -race -tags "${{ matrix.tags }}" ./...

  contract:
    name: output contract is unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # The golden files are the public output contract. A diff here is a diff
      # every consumer sees, so it must be committed deliberately alongside a
      # schema version bump — never regenerated by CI.
      - name: regenerate goldens
        run: make golden
      - name: fail if the contract drifted
        run: |
          if ! git diff --exit-code --stat; then
            echo
            echo "The output contract changed but the golden files were not updated."
            echo "Run 'make golden', review every diff, and bump the schema version"
            echo "of each affected kind in the same commit."
            exit 1
          fi

  # The fuzz sweep does not run on a pull request. It runs here after a merge,
  # and properly in fuzz-nightly.yml.
  #
  # The regression half is already on the pull request, inside every `test` leg
  # above: `go test` compiles the fuzz files under all four tag sets and
  # executes the seed corpus plus every crasher ever committed under
  # testdata/fuzz, deterministically, with no fuzzing budget at all. That is
  # what stops a fixed bug from returning, and it is the half worth blocking a
  # merge on.
  #
  # What is left is discovery, and discovery scales with cumulative CPU time
  # against a corpus that persists rather than with the length of any one run.
  # A 20-second run against a corpus last night already explored re-derives
  # what it derived then, so on a pull request it was paying for almost no new
  # coverage. It was measured before it was removed: ten legs each spent about
  # 30 seconds on checkout, setup-go, and compiling to do 20 seconds of
  # fuzzing, and because 19 jobs were queueing for a runner pool that does not
  # hold 19, the last leg did not start until 136 seconds into the run.
  #
  # What stays on the pull request is the deterministic part. What moves here
  # is the part whose verdict is a matter of luck and timing, which is also the
  # part that should never have been able to fail somebody's unrelated merge.
  fuzz-packages:
    name: list the packages with fuzz targets
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # Discovered rather than listed, and by the Makefile rather than here,
      # because the tag set a target hides behind is the Makefile's business:
      # `make fuzz` once swept past internal/workflow entirely, since an
      # untagged `go test -list` reported no targets there.
      - name: list
        id: list
        run: |
          packages=$(make -s fuzz-packages | jq -R . | jq -sc .)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "$packages"

  fuzz-run:
    name: fuzz (${{ matrix.package }})
    needs: fuzz-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.fuzz-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # Go keeps the generated corpus in $GOCACHE/fuzz. Without this, every CI
      # run starts from the seeds alone and spends its whole budget
      # re-deriving the same shallow coverage. Persisting it makes each run
      # continue where the last one stopped, so coverage compounds instead of
      # resetting.
      - name: locate the fuzz cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - name: restore the fuzz corpus
        uses: actions/cache@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          # Keyed per package, because each job only ever fuzzes one and a
          # shared key would have ten jobs racing to overwrite one entry. The
          # key rotates every run so a run that finds new inputs saves them;
          # restore-keys falls back to the most recent previous corpus, which
          # on a pull request is whatever the nightly left on main.
          key: fuzz-corpus-${{ matrix.package }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.package }}-
      - name: fuzz
        run: make fuzz FUZZPKGS=./${{ matrix.package }} FUZZTIME=20s
      - name: upload any crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ strategy.job-index }}
          path: ${{ matrix.package }}/testdata/fuzz/

  # Ten leg results and one verdict, so a red sweep on main is one line in the
  # run list rather than a matrix somebody has to expand.
  #
  # It is not a required check. Nothing here is, now that the sweep does not run
  # on a pull request, and a required context that only ever reports "skipped"
  # is the gate-that-cannot-fail this repository keeps finding in other clothes.
  # internal/lint/requiredchecks_test.go holds the ruleset's list to these job
  # names either way.
  fuzz:
    name: fuzz
    needs: [fuzz-packages, fuzz-run]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: every package fuzzed and none failed
        run: |
          echo "discovery: ${{ needs.fuzz-packages.result }}"
          echo "sweep:     ${{ needs.fuzz-run.result }}"
          # A skipped sweep is a failure and not a pass. It means discovery
          # produced no packages, and a green tick for having fuzzed nothing is
          # the exact shape of gate this repository keeps finding.
          [ "${{ needs.fuzz-packages.result }}" = "success" ] || exit 1
          [ "${{ needs.fuzz-run.result }}" = "success" ] || exit 1

  profiles:
    name: build profiles and size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: build every profile
        run: make build-all
      - name: reader stays under budget
        run: make size
      - name: every profile reports its own identity
        run: |
          for b in bin/jr bin/jr-agent bin/jr-reader bin/jr-ci; do
            "$b" version --format tsv | grep '^display'
          done
