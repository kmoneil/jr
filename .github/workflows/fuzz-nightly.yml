# The fuzz search, kept off the pull-request path on purpose.
#
# ci.yml runs 20 seconds a target on a pull request, which exercises the
# machinery against the code that just changed. This is where discovery
# actually happens: 10 minutes a target, every night, against a corpus that
# carries over from the run before, because coverage compounds with cumulative
# CPU time and not with the length of any one run.
#
# It is scheduled rather than required for the same reason it is long. A find
# here is usually about code the last pull request never touched, and a
# nondeterministic red on somebody's unrelated merge teaches people to press
# re-run, which is how a real crasher gets waved through. So a find opens an
# issue and keeps the input; it does not block a queue.
name: fuzz-nightly

on:
  schedule:
    # 07:17 UTC. Off the hour because every cron in the world runs on it, and
    # a queued runner is a shorter fuzz run.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: time budget per target
        required: false
        default: 10m

permissions:
  contents: read

env:
  # The patch, not the minor. See the note in ci.yml: setup-go pins
  # GOTOOLCHAIN=local, so this has to match go.mod's directive exactly.
  GO_VERSION: "1.26.6"

jobs:
  packages:
    name: list the packages with fuzz targets
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: list
        id: list
        run: |
          packages=$(make -s fuzz-packages | jq -R . | jq -sc .)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "$packages"

  fuzz:
    name: fuzz (${{ matrix.package }})
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      # No fail-fast: each package is an independent hunt, and killing the
      # other nine because one found something is throwing away the night.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: locate the fuzz cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      # The same key prefix ci.yml uses, deliberately. This runs on the default
      # branch, and a cache written there is readable from every pull request,
      # so what the night finds is what tomorrow's 20-second runs start from.
      - name: restore the fuzz corpus
        uses: actions/cache@v6
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: fuzz-corpus-${{ matrix.package }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.package }}-
      - name: fuzz
        run: make fuzz FUZZPKGS=./${{ matrix.package }} FUZZTIME=${{ inputs.fuzztime || '10m' }}
      # The input Go wrote is the whole value of the run. It is committed by
      # hand as an f.Add seed alongside the fix, so it has to survive the
      # runner: an artifact, and an issue that says where to find it.
      - name: upload the crasher
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crasher-${{ strategy.job-index }}
          path: ${{ matrix.package }}/testdata/fuzz/
          if-no-files-found: warn

  # `failure()` is the trigger and it is not the finding, which is the rule
  # docs/invariants.md states for every scheduled sweep and the mutation
  # workflow was the first to learn. It fires for a target that crashed, for a
  # leg that died in `actions/setup-go` before fuzzing anything, and for the
  # `packages` job failing so that no leg ran at all. Only the first of those is
  # a find, and the issue this job files says a crasher exists and tells the
  # reader to commit the input as an `f.Add` seed.
  #
  # The mutation sweep answers this by publishing what it measured as a job
  # output. That is not available here: `fuzz` is a matrix, and every leg writes
  # to one output namespace, so the value that survives is a race. What is
  # available is the run's own record, so the report asks the API which job
  # failed and at which step, which is what a person does when they open a red
  # run.
  report:
    name: report a find
    needs: fuzz
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # For reading this run's own jobs, below. Without it the query 403s and
      # the step fails, which is loud rather than wrong, and the point is to be
      # neither.
      actions: read
    steps:
      # `gh issue create` refuses the whole issue over a label it cannot find,
      # so the label has to exist before the report does. It did not on
      # 2026-08-15: the sweep found a real crasher in internal/adf, this step
      # exited 1 with "could not add label: 'fuzz' not found", and nothing was
      # filed. The run was red, which is the only reason anybody looked.
      #
      # --force updates the label if it is already there, so this is idempotent
      # and the report no longer depends on repository settings staying put.
      - name: make sure the label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create fuzz \
            --repo "${{ github.repository }}" \
            --color 5319e7 \
            --description "Found by the nightly fuzz sweep" \
            --force
      # Which legs actually reported a crasher, and which went red for some
      # other reason. A leg that never reached its `fuzz` step measured nothing,
      # and saying otherwise is the whole defect this job had.
      - name: read what this run did
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs=$(gh api \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100")

          # `steps` is absent for a job that never started, so every filter
          # defaults it rather than indexing into null.
          found=$(printf '%s' "$jobs" | jq -r '
            [ .jobs[]
              | select(.name | startswith("fuzz ("))
              | select(any((.steps // [])[]; .name == "fuzz" and .conclusion == "failure"))
              | .name ] | join(", ")')

          # Anything red whose `fuzz` step did not fail: the packages job, a
          # checkout, a setup-go that could not reach the proxy. A job still
          # running has a null conclusion and is not one of these, which is also
          # how this job leaves itself out: it is in progress while it asks, and
          # the endpoint returns the latest attempt of each job rather than a
          # previous one.
          broke=$(printf '%s' "$jobs" | jq -r '
            [ .jobs[]
              | select(.conclusion == "failure")
              | select(any((.steps // [])[]; .name == "fuzz" and .conclusion == "failure") | not)
              | "\(.name) at \([ (.steps // [])[] | select(.conclusion == "failure") | .name ] | join(", "))" ]
            | join("; ")')

          {
            echo "found=$found"
            echo "broke=$broke"
          } >> "$GITHUB_OUTPUT"
          echo "found: ${found:-none}"
          echo "broke: ${broke:-none}"

      # One issue per run rather than one per package, because a crasher in a
      # shared helper lights up several at once and ten issues describing one
      # bug is worse than one issue naming ten packages.
      - name: open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          FOUND: ${{ steps.what.outputs.found }}
          BROKE: ${{ steps.what.outputs.broke }}
        run: |
          if [ -n "$FOUND" ]; then
            title="fuzz: the nightly sweep found something"
            detail="A fuzz target failed in: $FOUND."
            action="$(printf '%s\n' \
              "The failing input is attached to that run as an artifact. Commit it" \
              "under the target's testdata/fuzz directory **and** add it as an" \
              "\`f.Add\` seed in the same change, so the regression is visible in the" \
              "test source and not only in a corpus file." \
              "" \
              "A red here is sometimes golang/go#75804 rather than a real find:" \
              "scripts/fuzz-verdict.sh classifies it, and the job log says which" \
              "verdict it reached.")"
            if [ -n "$BROKE" ]; then
              action="$(printf '%s\n' "$action" "" \
                "Part of the sweep did not run: $BROKE. The find above stands, and" \
                "the packages behind those legs were not fuzzed tonight, so a clean" \
                "result for them is not a result.")"
            fi
          else
            title="fuzz: the nightly sweep did not finish"
            detail="No target reported a crasher. What went red is: ${BROKE:-nothing this run attributed to a job, which is a cancellation or a leg that ended before its status was written}."
            action="$(printf '%s\n' \
              "**There is nothing to commit as a seed.** No fuzzing happened in the" \
              "legs named above, so this run says nothing about the code, and a" \
              "green run tomorrow does not clear anything either: the packages" \
              "behind those legs simply went unswept. Re-run the workflow.")"
          fi

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$title" \
            --label fuzz \
            --body "$(printf '%s\n' \
              "$detail" \
              "" \
              "Commit: $SHA" \
              "Run: $RUN" \
              "" \
              "$action")"
